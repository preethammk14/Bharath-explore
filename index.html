    <script>
      // Gracefully suppress preview-specific HMR WebSocket disconnection errors
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          String(event.reason).includes('WebSocket') ||
          (event.reason && event.reason.message && event.reason.message.includes('WebSocket')) ||
          String(event.reason).includes('closed without being opened')
        )) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && (
          event.message.includes('WebSocket') ||
          event.message.includes('failed to connect') ||
          event.message.includes('closed without being opened')
        )) {
          event.preventDefault();
        }
      });
    </script>
